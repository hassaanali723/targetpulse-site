<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 214" role="img" aria-label="Two email verification tools check the same address. Tool A connects from a clean, trusted IP and the provider returns 250, a Valid result. Tool B connects from a cheap, flagged IP and the same provider defers with 451 or blocks it, a Unknown result. Same email, different answers, because of IP reputation.">
  <rect x="1" y="1" width="698" height="212" rx="16" fill="#ffffff" stroke="#e6ebf2"/>
  <defs><marker id="ip_ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><polygon points="0,0 8,3.2 0,6.4" fill="#334155"/></marker></defs>
  <text x="350" y="24" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#334155">Both tools verify the same address: <tspan font-family="IBM Plex Mono,ui-monospace,monospace">sarah@brand.com</tspan></text>
  <rect x="322" y="58" width="98" height="120" rx="10" fill="none" stroke="#334155" stroke-opacity=".55"/>
  <text x="371" y="112" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#334155">Provider</text>
  <text x="371" y="127" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#334155">mail server</text>
  <rect x="20" y="70" width="152" height="46" rx="9" fill="none" stroke="#12805c" stroke-opacity=".8"/>
  <text x="96" y="90" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#334155">Tool A</text>
  <text x="96" y="105" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="10" fill="#12805c">clean, trusted IP</text>
  <line x1="172" y1="93" x2="320" y2="86" stroke="#334155" stroke-width="1.4" marker-end="url(#ip_ar)"/>
  <line x1="420" y1="88" x2="486" y2="88" stroke="#12805c" stroke-width="1.6" marker-end="url(#ip_ar)"/>
  <text x="494" y="84" font-family="IBM Plex Mono,ui-monospace,monospace" font-size="11" fill="#12805c">250 OK</text>
  <rect x="494" y="92" width="60" height="21" rx="10.5" fill="none" stroke="#12805c" stroke-opacity=".5"/>
  <text x="524" y="106.5" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="11" font-weight="700" fill="#12805c">Valid</text>
  <rect x="20" y="124" width="152" height="46" rx="9" fill="none" stroke="#a8620a" stroke-opacity=".8"/>
  <text x="96" y="144" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#334155">Tool B</text>
  <text x="96" y="159" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="10" fill="#a8620a">cheap, flagged IP</text>
  <line x1="172" y1="147" x2="320" y2="152" stroke="#334155" stroke-width="1.4" marker-end="url(#ip_ar)"/>
  <line x1="420" y1="150" x2="486" y2="150" stroke="#5b5570" stroke-width="1.6" marker-end="url(#ip_ar)"/>
  <text x="494" y="146" font-family="IBM Plex Mono,ui-monospace,monospace" font-size="11" fill="#5b5570">451 / blocked</text>
  <rect x="494" y="154" width="78" height="21" rx="10.5" fill="none" stroke="#5b5570" stroke-opacity=".5"/>
  <text x="533" y="168.5" text-anchor="middle" font-family="Hanken Grotesk,system-ui,sans-serif" font-size="11" font-weight="700" fill="#5b5570">Unknown</text>
</svg>
